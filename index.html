<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Simonetta:wght@400;700&family=Tangerine:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <title>Wedding Invitation</title>
  </head>

  <body>
    <!-- INTRO -->
    <div class="intro-text top">
      <h2>You're Invited</h2>
      <h1>Justine & Maribeth</h1>
    </div>

    <div class="intro-text bottom">Scroll down to open the envelope</div>

    <!-- SCENE -->
    <div class="scene">
      <div class="wrapper">
        <div class="back"></div>

        <div class="lid one"></div>
        <div class="lid two"></div>

        <div class="envelope"></div>

        <div class="letter">
          <section class="page page-1">
            <div class="page-content">
              <h1>
                Justine De Guzman
                <br />
                &
                <br />
                Maribeth Ruiz
              </h1>
              <p>INVITE YOU TO JOIN IN THE CELEBRATION OF OUR MARRIAGE</p>
            </div>
          </section>

          <section class="letter-preview">
            <div class="page-content">
              <h1>
                Justine De Guzman
                <br />
                &
                <br />
                Maribeth Ruiz
              </h1>
              <p>INVITE YOU TO JOIN IN THE CELEBRATION OF OUR MARRIAGE</p>
            </div>
          </section>

          <section class="page page-2">
            <h2>Wedding Details</h2>
          </section>

          <section class="page page-3">
            <h2>RSVP</h2>
          </section>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
